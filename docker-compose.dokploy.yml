# Dokploy "Docker Compose" service. No host ports: Traefik routes via the domains
# set in the Dokploy UI (web -> 3001, server -> 3000).
# All secrets come from .env.deploy, a file mounted by Dokploy (Advanced > Mounts),
# because Dokploy's Environment-tab interpolation did not reach every service.
name: narbel

x-healthcheck-fetch: &fetch-check
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  postgres:
    # pgrust: Postgres rebuilt in Rust, drop-in for the official image (same env vars)
    image: malisper/pgrust:v0.4-beta
    env_file: [.env.deploy]
    volumes:
      - narbel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d narbel -c 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - narbel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  s3:
    # MinIO no longer publishes images to Docker Hub; RustFS is an S3-compatible drop-in.
    image: rustfs/rustfs
    env_file: [.env.deploy]
    volumes:
      - narbel_s3_data:/data
    restart: unless-stopped

  s3-setup:
    image: amazon/aws-cli
    env_file: [.env.deploy]
    environment:
      # rustfs rejects aws-cli v2's checksum headers with SignatureDoesNotMatch
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    depends_on:
      - s3
    entrypoint:
      - /bin/sh
      - -c
      - until aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$${S3_BUCKET}"; do sleep 2; done
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
    env_file: [.env.deploy]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runner
    init: true
    env_file: [.env.deploy]
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *fetch-check
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        # replaced by the real API domain when domains are added
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://84.247.158.105:3000}
    init: true
    environment:
      SERVER_URL: http://server:3000
    expose:
      - "3001"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      <<: *fetch-check
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
    restart: unless-stopped

volumes:
  narbel_postgres_data:
  narbel_redis_data:
  narbel_s3_data:
