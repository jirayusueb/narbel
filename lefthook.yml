# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-push:
  jobs:
    - name: redproof
      run: bunx redproof check

pre-commit:
  parallel: true
  jobs:
    - run: bunx ultracite fix {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.scss"
        - "*.less"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.html"
        - "*.md"
        - "*.mdx"
        - "*.yaml"
        - "*.yml"
        - "*.graphql"
        - "*.gql"
      exclude:
        - "packages/ndraw/**"
      stage_fixed: true
    - name: oxlint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      exclude:
        - "packages/ndraw/**"
      run: bun oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc}"
      exclude:
        - "packages/ndraw/**"
      run: bun oxfmt --write {staged_files}
      stage_fixed: true
    - name: react-doctor
      glob: "*.{js,jsx,ts,tsx}"
      exclude:
        - "packages/ndraw/**"
      run: bunx react-doctor --staged -y --no-telemetry --no-supply-chain
