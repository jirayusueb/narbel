name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redproof:
    name: redproof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: narbel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # the database-backed tests skip themselves when Postgres is unreachable; CI gives them one
      DATABASE_URL: postgresql://postgres:password@localhost:5432/narbel
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # the root db:migrate goes through an interactive turbo task, which needs a terminal
      - run: bun run db:migrate
        working-directory: packages/db
      # routeTree.gen.ts is generated and gitignored; the build creates it and proves the web build
      - run: bun run build
        working-directory: apps/web
        env:
          VITE_SERVER_URL: http://localhost:3000
      # a build that compiles can still crash every SSR route, for example when a module that reads `window` lands in the server bundle
      - name: web SSR smoke
        working-directory: apps/web
        env:
          VITE_SERVER_URL: http://localhost:3000
          SERVER_URL: http://127.0.0.1:9
          PORT: "3001"
          NODE_ENV: production
        run: |
          bun .output/server/index.mjs > "$RUNNER_TEMP/web-ssr.log" 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:3001/ && break; sleep 1; done
          for path in / /login /dashboard; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3001$path")
            if [ "$code" != 200 ]; then
              echo "::error::SSR $path answered $code"
              cat "$RUNNER_TEMP/web-ssr.log"
              exit 1
            fi
          done
      - run: bunx redproof check
